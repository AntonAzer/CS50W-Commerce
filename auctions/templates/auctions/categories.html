{% extends "auctions/layout.html" %}

{% block body %}
    <h2>Categories</h2>

    <div class="list-group col-md-6 mt-3">
        {% for category in categories %}
            <a href="{% url 'category_listings' category.id %}" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
                {{ category.name }}
                <span class="badge badge-primary badge-pill">{{ category.category_listings.count }}</span>
            </a>
        {% empty %}
            <p class="alert alert-info">No categories exist yet. Add some through Django Admin!</p>
        {% endfor %}
    </div>
{% endblock %}
