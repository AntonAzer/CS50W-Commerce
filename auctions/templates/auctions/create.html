{% extends "auctions/layout.html" %}

{% block body %}
    <h2>Create New Listing</h2>

    <form action="{% url 'create' %}" method="post" class="col-md-6 mt-3">
        {% csrf_token %}
        <div class="form-group">
            <label for="title">Title</label>
            <input type="text" class="form-control" id="title" name="title" required placeholder="Item Title">
        </div>
        <div class="form-group">
            <label for="description">Description</label>
            <textarea class="form-control" id="description" name="description" rows="4" required placeholder="Describe your item..."></textarea>
        </div>
        <div class="form-group">
            <label for="starting_bid">Starting Bid ($)</label>
            <input type="number" step="0.01" min="0.01" class="form-control" id="starting_bid" name="starting_bid" required placeholder="0.00">
        </div>
        <div class="form-group">
            <label for="image_url">Image URL (Optional)</label>
            <input type="url" class="form-control" id="image_url" name="image_url" placeholder="https://example.com/image.jpg">
        </div>
        <div class="form-group">
            <label for="category">Category (Optional)</label>
            <select class="form-control" id="category" name="category">
                <option value="">No Category Selected</option>
                {% for category in categories %}
                    <option value="{{ category.id }}">{{ category.name }}</option>
                {% endfor %}
            </select>
        </div>
        <button type="submit" class="btn btn-success">Publish Auction</button>
    </form>
{% endblock %}
